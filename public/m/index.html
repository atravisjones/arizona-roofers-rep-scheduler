<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Day</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; background: #f4f4f5; color: #18181b; }
  header { background: #4f46e5; color: #fff; padding: 10px 12px 10px 16px; position: sticky; top: 0; z-index: 1100; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header .hbtn { border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 700; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 13px; opacity: .9; margin-top: 2px; }
  #mapWrap { position: sticky; top: 52px; z-index: 1000; background: #e4e4e7; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  #map { height: 240px; transition: height .2s; }
  body.map-min #map { height: 0; }
  body.map-min #mapWrap { box-shadow: none; }
  section { padding: 12px 12px 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #52525b; margin: 6px 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .card.done { opacity: .5; background: #fafafa; }
  .card.done .name { text-decoration: line-through; }
  .btn.out { background: #e4e4e7; color: #27272a; }
  .btn.out.on-confirmed { background: #059669; color: #fff; }
  .btn.out.on-declined { background: #dc2626; color: #fff; }
  .btn.out.on-no_answer { background: #52525b; color: #fff; }
  .hist { font-size: 11px; color: #71717a; margin-top: 4px; }
  .card.sel { outline: 3px solid #f59e0b; box-shadow: 0 0 0 4px #f59e0b33; }
  .card[data-id] { cursor: pointer; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; gap: 12px; align-items: flex-start; }
  .num { flex: 0 0 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 14px; }
  .num.stop { background: #6366f1; }
  .num.check { background: #059669; }
  .num.check.d2d { background: #8b5cf6; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15px; }
  .meta { font-size: 13px; color: #52525b; margin-top: 2px; }
  .addr { font-size: 13px; color: #3f3f46; margin-top: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button.btn { border: 0; font: inherit; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; text-decoration: none; color: #fff; background: #4f46e5; }
  .btn.call { background: #059669; }
  .btn.copied { background: #d1fae5; color: #065f46; }
  .btn.ghost { background: #f4f4f5; color: #27272a; border: 1px solid #e4e4e7; }
  .big { display: block; margin: 12px 12px 0; text-align: center; padding: 12px; font-size: 15px; }
  .chips { display: flex; gap: 6px; }
  .chip { border: 1px solid #d4d4d8; background: #fff; color: #3f3f46; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .chip.on { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .value { color: #047857; font-weight: 800; }
  .empty { color: #71717a; font-size: 14px; padding: 8px 4px 16px; }
  .btn.pos { background: #f59e0b; color: #1c1917; }
  .btn.pos.on { background: #b45309; color: #fff; }
  .routebar { margin: 8px 12px 0; font-size: 12px; color: #52525b; text-align: center; }
  footer { text-align: center; color: #a1a1aa; font-size: 11px; padding: 16px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">My Day</h1>
    <div class="sub" id="subtitle">Loading…</div>
  </div>
  <button class="hbtn" id="mapToggle" type="button">Hide map</button>
</header>
<div id="mapWrap"><div id="map"></div></div>
<a id="routeLink" class="btn big" href="#" target="_blank" rel="noopener" hidden>▶ Drive the whole route in Google Maps</a>
<div class="routebar" id="routeBar"></div>

<section>
  <h2>Appointments <span id="stopCount"></span></h2>
  <div id="stops"></div>
</section>

<section>
  <h2>
    <span>Checks to pick up <span id="checkCount"></span></span>
    <span class="chips" id="radius">
      <button class="chip" data-mi="2">2 mi</button>
      <button class="chip on" data-mi="5">5 mi</button>
      <button class="chip" data-mi="10">10 mi</button>
      <button class="chip" data-mi="999">All</button>
    </span>
  </h2>
  <div id="checks"></div>
</section>
<footer>Arizona Roofers · checks = jobs in “INS: Collect ACV”, refreshed every 5 min · call ahead before you swing by</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const rep = params.get('rep') || 'Rep';
  const date = params.get('date') || '';
  let stops = [];
  try {
    const raw = params.get('s') || '';
    const json = atob(raw.replace(/-/g, '+').replace(/_/g, '/'));
    stops = JSON.parse(decodeURIComponent(escape(json)));
  } catch (e) { stops = []; }
  // stop = { n: name, a: address, t: time label, la: lat, lo: lon }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = v => v == null ? '' : '$' + Math.round(v).toLocaleString();
  const nav = addr => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(addr);
  const tel = p => 'tel:' + String(p || '').replace(/[^0-9+]/g, '');
  // CTM click-to-call: opens the softphone with the number filled in (the CTM Phone app takes
  // the link over when it's installed and claims app.calltrackingmetrics.com; otherwise the browser softphone).
  const ctmCall = p => { let d = String(p || '').replace(/[^0-9]/g, ''); if (d.length === 10) d = '1' + d; return 'https://app.calltrackingmetrics.com/calls/phone?to_number=' + d; };
  const miles = (a, b) => {
    const R = 3958.8, toR = d => d * Math.PI / 180;
    const dLat = toR(b.la - a.la), dLon = toR(b.lo - a.lo);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.la)) * Math.cos(toR(b.la)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };

  // Where the rep is right now. Google Maps starts the drive here (origin omitted = device
  // location) and checks are measured against the real drive line: me → stop 1 → stop 2 …
  let me = null;
  function routePoints() { return [...(me ? [me] : []), ...coordStops]; }
  // Real road route from OSRM (same router the planner uses): vertices of the drive line,
  // plus distance/time. Falls back to straight segments until it arrives.
  let drive = null; // { verts: [{la,lo}], miles, mins, key }
  let driveTimer = null;
  function pickedStops() {
    const byId = Object.fromEntries(checks.map(c => [c.jobId, c]));
    const pos = p => Object.keys(picks).filter(id => picks[id] === p && byId[id] && byId[id].lat != null).map(id => ({ la: byId[id].lat, lo: byId[id].lon }));
    return { before: pos('before'), after: pos('after') };
  }
  function drivePoints() { const p = pickedStops(); return [...(me ? [me] : []), ...p.before, ...coordStops, ...p.after]; }
  function refreshDrive() {
    clearTimeout(driveTimer);
    driveTimer = setTimeout(async () => {
      const pts = drivePoints();
      if (pts.length < 2) { drive = null; drawLine(); render(); return; }
      const key = pts.map(p => p.la.toFixed(4) + ',' + p.lo.toFixed(4)).join(';');
      if (drive && drive.key === key) return;
      try {
        const url = 'https://router.project-osrm.org/route/v1/driving/' + pts.map(p => p.lo + ',' + p.la).join(';') + '?overview=full&geometries=geojson';
        const d = await (await fetch(url)).json();
        const r = d.routes && d.routes[0];
        if (!r) throw new Error('no route');
        drive = { key, verts: r.geometry.coordinates.map(c => ({ la: c[1], lo: c[0] })), miles: r.distance * 0.000621371, mins: r.duration / 60 };
      } catch (e) { drive = null; }
      drawLine(); render();
    }, 150);
  }
  // Straight-line miles from a point to the nearest piece of the drive line (segment distance
  // in a local flat projection — plenty for "is this on my way").
  function milesOffRoute(pt) {
    const pts = (drive && drive.verts.length > 1) ? drive.verts : routePoints();
    if (!pts.length) return null;
    const kx = 69.17 * Math.cos(pt.la * Math.PI / 180), ky = 69.17;
    const P = { x: pt.lo * kx, y: pt.la * ky };
    let best = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const A = { x: pts[i].lo * kx, y: pts[i].la * ky };
      if (pts.length === 1 || i === pts.length - 1) { best = Math.min(best, Math.hypot(P.x - A.x, P.y - A.y)); continue; }
      const B = { x: pts[i + 1].lo * kx, y: pts[i + 1].la * ky };
      const dx = B.x - A.x, dy = B.y - A.y, len2 = dx * dx + dy * dy;
      const t = len2 ? Math.max(0, Math.min(1, ((P.x - A.x) * dx + (P.y - A.y) * dy) / len2)) : 0;
      best = Math.min(best, Math.hypot(P.x - (A.x + t * dx), P.y - (A.y + t * dy)));
    }
    return best;
  }

  const prettyDate = date ? new Date(date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) : '';
  document.getElementById('title').textContent = rep.split(' ')[0] + "'s day";
  document.getElementById('subtitle').textContent = prettyDate || 'Today';
  document.title = rep + ' · ' + (prettyDate || 'My Day');

  // Pickups the rep folds into the Google route: { jobId: 'before' | 'after' }, remembered per day on this phone.
  const PICK_KEY = 'm-route-picks:' + rep + ':' + date;
  let picks = {};
  try { picks = JSON.parse(localStorage.getItem(PICK_KEY) || '{}') || {}; } catch (e) { picks = {}; }
  const savePicks = () => { try { localStorage.setItem(PICK_KEY, JSON.stringify(picks)); } catch (e) {} };

  // Whole-route link: [checks before] → appointments in order → [checks after]
  function buildRoute() {
    const byId = Object.fromEntries(checks.map(c => [c.jobId, c]));
    const before = Object.keys(picks).filter(id => picks[id] === 'before' && byId[id]).map(id => byId[id].address);
    const after = Object.keys(picks).filter(id => picks[id] === 'after' && byId[id]).map(id => byId[id].address);
    const addrs = [...before, ...stops.map(s => s.a), ...after];
    const fromMe = !!me;
    const a = document.getElementById('routeLink');
    const bar = document.getElementById('routeBar');
    if (!addrs.length) { a.hidden = true; bar.textContent = ''; return; }
    let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving';
    // No origin = Google starts from the phone's current location; every address becomes a
    // waypoint except the last, which is the destination.
    const via = fromMe ? addrs.slice(0, -1) : addrs.slice(1, -1);
    if (!fromMe && addrs.length > 1) url += '&origin=' + encodeURIComponent(addrs[0]);
    url += '&destination=' + encodeURIComponent(addrs[addrs.length - 1]);
    if (via.length) url += '&waypoints=' + encodeURIComponent(via.join('|'));
    a.href = url; a.hidden = false;
    const n = before.length + after.length;
    a.textContent = n ? `▶ Drive the route · ${stops.length} appt${stops.length === 1 ? '' : 's'} + ${n} check${n === 1 ? '' : 's'}` : '▶ Drive the whole route in Google Maps';
    const start = (drive ? `${drive.miles.toFixed(1)} mi · ${Math.round(drive.mins)} min by road · ` : '') + (fromMe ? 'starts from where you are' : 'turn on location to start from where you are');
    bar.textContent = start + ' · ' + (n ? [before.length ? `${before.length} check${before.length === 1 ? '' : 's'} before` : '', after.length ? `${after.length} check${after.length === 1 ? '' : 's'} after` : ''].filter(Boolean).join(' · ') + ' the appointments' : 'call a check, then add it before or after your appointments');
  }

  // Stops
  const stopsEl = document.getElementById('stops');
  document.getElementById('stopCount').textContent = stops.length ? '· ' + stops.length : '';
  if (!stops.length) stopsEl.innerHTML = '<div class="empty">No appointments in this link.</div>';
  stops.forEach((s, i) => {
    stopsEl.insertAdjacentHTML('beforeend', `
      <div class="card">
        <div class="num stop">${i + 1}</div>
        <div class="body">
          <div class="name">${esc(s.n)}</div>
          ${s.t ? `<div class="meta">${esc(s.t)}</div>` : ''}
          <div class="addr">${esc(s.a)}</div>
          <div class="actions"><a class="btn" href="${nav(s.a)}" target="_blank" rel="noopener">🧭 Navigate</a></div>
        </div>
      </div>`);
  });

  // Map
  const map = L.map('map', { zoomControl: false, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  const group = L.featureGroup().addTo(map);
  const pin = (color, label, size) => L.divIcon({ className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2],
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);color:#fff;font-weight:800;font-size:${Math.round(size * .5)}px;display:flex;align-items:center;justify-content:center">${label}</div>` });
  const coordStops = stops.filter(s => s.la != null && s.lo != null);
  coordStops.forEach((s, i) => L.marker([s.la, s.lo], { icon: pin('#6366f1', stops.indexOf(s) + 1, 28), zIndexOffset: 1000 }).bindPopup(`<b>${esc(s.n)}</b><br>${esc(s.a)}`).addTo(group));
  let lineLayer = L.featureGroup().addTo(map);
  let meMarker = null;
  function drawLine() {
    lineLayer.clearLayers();
    if (drive && drive.verts.length > 1) { L.polyline(drive.verts.map(p => [p.la, p.lo]), { color: '#6366f1', weight: 5, opacity: .7 }).addTo(lineLayer); return; }
    const pts = routePoints();
    if (pts.length > 1) L.polyline(pts.map(p => [p.la, p.lo]), { color: '#6366f1', weight: 4, opacity: .6, dashArray: '6 8' }).addTo(lineLayer);
  }
  drawLine();
  let checkLayer = L.featureGroup().addTo(map);
  const mapToggle = document.getElementById('mapToggle');
  function setMapMin(min) {
    document.body.classList.toggle('map-min', min);
    document.getElementById('map').style.height = min ? '0px' : '240px';
    mapToggle.textContent = min ? 'Show map' : 'Hide map';
    try { localStorage.setItem('m-map-min', min ? '1' : ''); } catch (e) {}
    if (!min) setTimeout(() => { map.invalidateSize(); fit(); }, 220);
  }
  mapToggle.addEventListener('click', () => setMapMin(!document.body.classList.contains('map-min')));
  try { if (localStorage.getItem('m-map-min')) setMapMin(true); } catch (e) {}
  const fit = () => { const b = group.getBounds(); if (meMarker) b.extend(meMarker.getLatLng()); if (b.isValid()) map.fitBounds(b.pad(0.25)); else map.setView([33.5, -112.07], 10); };
  fit();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      me = { la: pos.coords.latitude, lo: pos.coords.longitude };
      meMarker = L.marker([me.la, me.lo], { icon: pin('#2563eb', '●', 20), zIndexOffset: 2000 }).bindPopup('You are here').addTo(group);
      drawLine(); fit(); render(); refreshDrive();
    }, () => { /* denied or unavailable: route starts at the first appointment */ }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  }

  // Checks
  let checks = [];
  let radius = 5;
  let selectedId = null;
  const checkMarkers = {};
  // Outcomes: { jobId: { today: 'confirmed'|'declined'|'no_answer'|null, history: [{date_key, outcome, rep}] } }
  let outcomes = {};
  const OUT_LABEL = { confirmed: 'Pickup confirmed', declined: 'Declined', no_answer: 'No answer' };
  const todayKey = date || new Date().toISOString().slice(0, 10);
  const isDead = c => { const t = outcomes[c.jobId]?.today; return t === 'declined' || t === 'no_answer'; };
  function ingestOutcomes(rows) {
    outcomes = {};
    // rows arrive newest-first; first row per job+date is the latest
    const seen = new Set();
    rows.forEach(r => {
      const k = r.job_id + '|' + r.date_key; if (seen.has(k)) return; seen.add(k);
      const o = outcomes[r.job_id] || (outcomes[r.job_id] = { today: null, history: [] });
      if (r.date_key === todayKey) o.today = r.outcome; else o.history.push(r);
    });
  }
  async function setOutcome(jobId, outcome) {
    const o = outcomes[jobId] || (outcomes[jobId] = { today: null, history: [] });
    o.today = outcome; render();
    try {
      await fetch('/api/check-outcomes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobId, rep, date: todayKey, outcome }) });
    } catch (e) { /* offline: stays local until reload */ }
  }
  buildRoute();
  refreshDrive();
  const checksEl = document.getElementById('checks');
  function render() {
    checkLayer.clearLayers();
    for (const k in checkMarkers) delete checkMarkers[k];
    const rows = checks
      .map(c => {
        const d = (c.lat != null && c.lon != null) ? milesOffRoute({ la: c.lat, lo: c.lon }) : null;
        return { c, d };
      })
      .filter(x => picks[x.c.jobId] || (routePoints().length === 0 ? radius >= 999 : (x.d != null && x.d <= radius)))
      .sort((a, b) => (isDead(a.c) - isDead(b.c)) || (a.d ?? 1e9) - (b.d ?? 1e9) || (b.c.value || 0) - (a.c.value || 0));
    const live = rows.filter(x => !isDead(x.c));
    document.getElementById('checkCount').textContent = '· ' + live.length + (live.length ? ' · ' + money(live.reduce((s, x) => s + (x.c.value || 0), 0)) : '') + (rows.length > live.length ? ` · ${rows.length - live.length} done` : '');
    checksEl.innerHTML = rows.length ? '' : `<div class="empty">${routePoints().length ? 'No checks within ' + radius + ' mi of your route. Try a wider radius.' : 'No stops with coordinates in this link — showing nothing until you pick “All”.'}</div>`;
    rows.forEach(({ c, d }) => {
      const days = c.daysInStage != null ? c.daysInStage + 'd waiting' : '';
      const dist = d != null ? (d < 0.1 ? 'on' : d.toFixed(1) + ' mi off') + ' your route' : '';
      checksEl.insertAdjacentHTML('beforeend', `
        <div class="card${selectedId === c.jobId ? ' sel' : ''}${isDead(c) ? ' done' : ''}" data-id="${esc(c.jobId)}">
          <div class="num check${c.isD2D ? ' d2d' : ''}">$</div>
          <div class="body">
            <div class="name">${esc(c.customerName || 'Unknown')} <span class="value">${money(c.value)}</span></div>
            <div class="meta">${[dist, days, c.jobOwner ? 'Rep: ' + esc(c.jobOwner) : ''].filter(Boolean).join(' · ')}</div>
            <div class="addr">${esc(c.address)}</div>
            <div class="actions">
              ${c.phone ? `<a class="btn call" href="${ctmCall(c.phone)}" target="_blank" rel="noopener">📞 Call (CTM)</a><a class="btn ghost" href="${tel(c.phone)}">Dialer</a><button class="btn ghost" type="button" data-copy="${esc(c.phone)}">Copy #</button>` : ''}
              <a class="btn" href="${nav(c.address)}" target="_blank" rel="noopener">🧭 Navigate</a>
              <a class="btn ghost" href="https://app.roofr.com/dashboard/jobs/list-view?selectedJobId=${encodeURIComponent(c.jobId)}" target="_blank" rel="noopener">Roofr</a>
            </div>
            <div class="actions">
              ${['confirmed', 'declined', 'no_answer'].map(o => `<button class="btn out${outcomes[c.jobId]?.today === o ? ' on-' + o : ''}" type="button" data-outcome="${o}" data-job="${esc(c.jobId)}">${outcomes[c.jobId]?.today === o ? '✓ ' : ''}${OUT_LABEL[o]}</button>`).join('')}
            </div>
            ${(outcomes[c.jobId]?.history || []).length ? `<div class="hist">History: ${outcomes[c.jobId].history.slice(0, 5).map(h => `${new Date(h.date_key + 'T12:00:00').toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' })} ${OUT_LABEL[h.outcome] || h.outcome}${h.rep && h.rep !== rep ? ' (' + esc(h.rep.split(' ')[0]) + ')' : ''}`).join(' · ')}</div>` : ''}
            <div class="actions"${isDead(c) ? ' hidden' : ''}>
              <button class="btn pos${picks[c.jobId] === 'before' ? ' on' : ''}" data-pick="${esc(c.jobId)}" data-pos="before">${picks[c.jobId] === 'before' ? '✓ Before appts' : '+ Before appts'}</button>
              <button class="btn pos${picks[c.jobId] === 'after' ? ' on' : ''}" data-pick="${esc(c.jobId)}" data-pos="after">${picks[c.jobId] === 'after' ? '✓ After appts' : '+ After appts'}</button>
            </div>
          </div>
        </div>`);
      if (c.lat != null && c.lon != null) checkMarkers[c.jobId] = L.marker([c.lat, c.lon], { icon: pin(selectedId === c.jobId ? '#f59e0b' : (c.isD2D ? '#8b5cf6' : '#059669'), '$', selectedId === c.jobId ? 34 : 22), zIndexOffset: selectedId === c.jobId ? 1500 : 0 })
        .bindPopup(`<b>${esc(c.customerName)}</b> ${money(c.value)}<br>${esc(c.address)}<br>${c.phone ? `<a href="${tel(c.phone)}">${esc(c.phone)}</a>` : ''}`).addTo(checkLayer);
    });
    buildRoute();
  }
  checksEl.addEventListener('click', async e => {
    if (e.target.closest('a, button')) { /* buttons handled below */ } else {
      const card = e.target.closest('.card[data-id]'); if (!card) return;
      const id = card.dataset.id;
      selectedId = selectedId === id ? null : id;
      render();
      const mk = checkMarkers[selectedId];
      if (mk) {
        if (document.body.classList.contains('map-min')) setMapMin(false);
        setTimeout(() => { map.setView(mk.getLatLng(), Math.max(map.getZoom(), 14), { animate: true }); mk.openPopup(); }, 50);
      }
      return;
    }
    const ob = e.target.closest('[data-outcome]');
    if (ob) {
      const id = ob.dataset.job, o = ob.dataset.outcome;
      const cur = outcomes[id]?.today;
      if (cur !== o && (o === 'declined' || o === 'no_answer') && picks[id]) { delete picks[id]; savePicks(); refreshDrive(); }
      setOutcome(id, cur === o ? null : o);   // tap again to undo
      return;
    }
    const cp = e.target.closest('[data-copy]');
    if (cp) {
      const num = String(cp.dataset.copy).replace(/[^0-9+]/g, '');
      try { await navigator.clipboard.writeText(num); } catch (err) { window.prompt('Copy this number', num); }
      cp.textContent = 'Copied'; cp.classList.add('copied');
      setTimeout(() => { cp.textContent = 'Copy #'; cp.classList.remove('copied'); }, 1500);
      return;
    }
    const b = e.target.closest('[data-pick]'); if (!b) return;
    const id = b.dataset.pick, pos = b.dataset.pos;
    if (picks[id] === pos) delete picks[id]; else picks[id] = pos;   // tap again to remove
    savePicks(); render(); refreshDrive();
  });
  document.getElementById('radius').addEventListener('click', e => {
    const b = e.target.closest('[data-mi]'); if (!b) return;
    radius = Number(b.dataset.mi);
    document.querySelectorAll('#radius .chip').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  fetch('/api/check-outcomes?days=60').then(r => r.json()).then(d => { ingestOutcomes(d.outcomes || []); render(); }).catch(() => {});
  fetch('/api/insurance-checks').then(r => r.json()).then(d => { checks = d.checks || []; render(); refreshDrive(); })
    .catch(() => { checksEl.innerHTML = '<div class="empty">Could not load checks.</div>'; });
})();
</script>
</body>
</html>
