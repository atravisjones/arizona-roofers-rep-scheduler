<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Map - Arizona Roofers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111; }
    #map { width: 100vw; height: 100vh; }

    /* Day navigation bar */
    .day-nav {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
      display: flex; align-items: center; gap: 0;
      background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18);
      overflow: hidden; user-select: none;
    }
    .day-nav-btn {
      background: none; border: none; padding: 10px 14px; cursor: pointer;
      font-size: 16px; color: #666; transition: background .1s;
    }
    .day-nav-btn:hover { background: #f5f5f5; }
    .day-nav-btn:active { background: #eee; }
    .day-nav-center {
      display: flex; flex-direction: column; align-items: center; padding: 4px 12px;
      min-width: 140px; cursor: pointer; position: relative;
    }
    .day-nav-date { font-weight: 700; font-size: 15px; color: #222; }
    .day-nav-day { font-size: 11px; color: #888; font-weight: 500; }
    .day-nav-center input {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .day-nav-today {
      background: none; border: none; padding: 8px 12px; cursor: pointer;
      font-size: 11px; font-weight: 600; color: #ea580c; border-left: 1px solid #eee;
    }
    .day-nav-today:hover { background: #fff5f0; }

    /* Stats bar — top left, clear of zoom (now bottom-right) */
    .stats-bar {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      display: flex; gap: 6px; align-items: center;
    }
    .stat-chip {
      background: #fff; border-radius: 8px; padding: 5px 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12); font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 5px; color: #444;
    }
    .stat-icon { width: 10px; height: 10px; flex-shrink: 0; display: inline-block; }
    .stat-count { font-weight: 700; }

    /* PM panel - right side */
    .pm-panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: #fff; border-radius: 10px; padding: 12px 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15); min-width: 180px; max-width: 220px;
    }
    .pm-header { font-weight: 700; font-size: 11px; text-transform: uppercase; color: #666; margin-bottom: 8px; letter-spacing: .4px; }
    .pm-list { list-style: none; }
    .pm-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 4px;
      font-size: 13px; color: #333; border-bottom: 1px solid #f0f0f0;
      cursor: pointer; border-radius: 6px; transition: background .1s;
    }
    .pm-item:last-child { border-bottom: none; }
    .pm-item:hover { background: #f5f5f5; }
    .pm-item.active { background: #f0f7ff; }
    .pm-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.1); }
    .pm-name { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pm-count { font-size: 11px; color: #999; font-weight: 500; }
    .pm-gps-placeholder {
      margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd;
      font-size: 10px; color: #bbb; font-style: italic; text-align: center;
    }

    /* Legend removed — merged into stats bar */

    /* Loading overlay */
    .loading-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 1001; background: #fff; border-radius: 12px;
      padding: 24px 36px; box-shadow: 0 4px 24px rgba(0,0,0,.2);
      text-align: center; font-size: 14px; color: #444;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #eee;
      border-top-color: #ea580c; border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }

    .empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 1000; background: #fff; border-radius: 12px;
      padding: 30px 40px; box-shadow: 0 4px 24px rgba(0,0,0,.15);
      text-align: center; color: #666;
    }
    .empty-state h2 { font-size: 16px; color: #333; margin-bottom: 6px; }
    .empty-state p { font-size: 13px; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .stats-bar { top: 52px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); justify-content: center; flex-wrap: wrap; }
      .day-nav { top: 8px; }
      .pm-panel {
        top: auto; bottom: 0; left: 0; right: 0;
        border-radius: 16px 16px 0 0; max-width: 100%; min-width: 0;
        padding: 10px 14px 14px; max-height: 35vh; overflow-y: auto;
        box-shadow: 0 -2px 12px rgba(0,0,0,.15);
      }
      .pm-header { text-align: center; }
      .pm-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
      .pm-item {
        flex: 0 0 auto; padding: 5px 10px; border-bottom: none;
        background: #f5f5f5; border-radius: 20px; font-size: 12px; gap: 5px;
      }
      .pm-item.active { background: #dbeafe; }
      .pm-gps-placeholder { display: none; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Day navigation -->
<div class="day-nav">
  <button class="day-nav-btn" onclick="shiftDay(-1)" title="Previous day">&#9664;</button>
  <div class="day-nav-center">
    <span class="day-nav-date" id="navDate"></span>
    <span class="day-nav-day" id="navDay"></span>
    <input type="date" id="datePicker" />
  </div>
  <button class="day-nav-btn" onclick="shiftDay(1)" title="Next day">&#9654;</button>
  <button class="day-nav-today" onclick="goToday()">Today</button>
</div>

<!-- Stats chips -->
<div class="stats-bar" id="statsBar"></div>

<!-- PM panel -->
<div class="pm-panel" id="pmPanel">
  <div class="pm-header">Production Team</div>
  <ul class="pm-list" id="pmList"></ul>
  <div class="pm-gps-placeholder">Live GPS coming soon</div>
</div>


<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingText">Loading events...</span>
</div>

<div class="empty-state hidden" id="emptyState">
  <h2>No production events</h2>
  <p>No installs, material drops, or walkthroughs found for this date.</p>
</div>

<script>
// ── Config ──
const SB_URL = 'https://ucfqgkbkxbztxlyniuph.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjZnFna2JreGJ6dHhseW5pdXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNjI1ODQsImV4cCI6MjA4OTkzODU4NH0.iIRHU4pxcVSMiWAcjtMgUsAVfwRnl90zg4Zkg0Fe4a0';
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };
const ROOFR_TEAM = 239329;

const PALETTE = [
  '#dc2626','#2563eb','#16a34a','#ea580c','#7c3aed',
  '#0891b2','#db2777','#ca8a04','#0d9488','#65a30d',
  '#4f46e5','#c026d3','#b45309','#0e7490','#15803d',
  '#9333ea','#be123c','#1d4ed8'
];

// Production team roster (for PM panel display)
const PROD_TEAM = [
  'Jayda Fairfield', 'Raven Pelfrey', 'Conor Smith',
  'Austin Huffman', 'Brandon Jordan', 'Carter Grant',
  'Brian Carter', 'Jon Leonard', 'Robert McPherson',
];

// Roofr user ID → name (calendar attendees are often numeric IDs)
const ROOFR_ID_MAP = {
  '345606': 'Jayda Fairfield',
  '392253': 'Jayda Fairfield',
  '471949': 'Jayda Fairfield',
  '494364': 'Jayda Fairfield',
  '498530': 'Robert McPherson',
  '467577': 'Carter Grant',
  '407608': 'Brian Carter',
  '481793': 'Brian Carter',
  '501518': 'Austin Huffman',
  '374467': 'Austin Huffman',   // crew partner — refine later
};

// Colors match Roofr calendar categories
const TYPE_CONFIG = {
  install:          { label: 'Install',        color: '#16a34a', shape: 'square' },   // green (Roofr production)
  material_dropoff: { label: 'Material Drop',  color: '#ea580c', shape: 'diamond' },  // orange (Roofr pickups)
  walkthrough:      { label: 'Walkthrough',    color: '#f59e0b', shape: 'circle' },   // amber (Roofr post-production)
  warranty:         { label: 'Warranty',       color: '#f59e0b', shape: 'circle' },   // amber (Roofr post-production)
  other:            { label: 'Other',          color: '#888',    shape: 'square' },
};

// ── State ──
let map, markersLayer;
let currentDate = '';
let events = [];
let geocodeCache = {};
let markersByPM = {};     // pmName → [{marker, baseIcon, evt}]
let hoveredPM = null;
let selectedPM = null;    // click-locked PM filter
let colorMap = {};

try {
  const saved = localStorage.getItem('prod-map-geocode-cache');
  if (saved) geocodeCache = JSON.parse(saved);
} catch (e) {}

function saveGeocodeCache() {
  try { localStorage.setItem('prod-map-geocode-cache', JSON.stringify(geocodeCache)); } catch (e) {}
}

// ── Date helpers ──
function todayPhoenix() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Phoenix' }))
    .toISOString().split('T')[0];
}

function formatDateDisplay(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const month = d.toLocaleDateString('en-US', { month: 'short' });
  const day = d.getDate();
  return `${month} ${day}`;
}

function formatDayName(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const today = todayPhoenix();
  if (dateStr === today) return 'Today';
  const yesterday = new Date(new Date(today + 'T12:00:00').getTime() - 86400000).toISOString().split('T')[0];
  const tomorrow = new Date(new Date(today + 'T12:00:00').getTime() + 86400000).toISOString().split('T')[0];
  if (dateStr === yesterday) return 'Yesterday';
  if (dateStr === tomorrow) return 'Tomorrow';
  return d.toLocaleDateString('en-US', { weekday: 'long' });
}

function shiftDay(offset) {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate() + offset);
  currentDate = d.toISOString().split('T')[0];
  document.getElementById('datePicker').value = currentDate;
  updateDateDisplay();
  loadEvents();
}

function goToday() {
  currentDate = todayPhoenix();
  document.getElementById('datePicker').value = currentDate;
  updateDateDisplay();
  loadEvents();
}

function updateDateDisplay() {
  document.getElementById('navDate').textContent = formatDateDisplay(currentDate);
  document.getElementById('navDay').textContent = formatDayName(currentDate);
}

// ── Resolve attendees: numeric IDs → names, find production team member ──
function resolveAttendees(rawAttendees) {
  if (!rawAttendees) return { names: [], prodMember: null };
  const parts = rawAttendees.split(',').map(s => s.trim()).filter(Boolean);
  const names = parts.map(p => ROOFR_ID_MAP[p] || (p.match(/^\d+$/) ? null : p)).filter(Boolean);
  // Deduplicate (Jayda has multiple IDs)
  const unique = [...new Set(names)];
  // Find first production team member
  const prodMember = unique.find(n => PROD_TEAM.includes(n)) || null;
  return { names: unique, prodMember };
}

// ── Supabase queries ──
async function sbGet(table, params) {
  const url = new URL(`${SB_URL}/${table}`);
  if (params) Object.entries(params).forEach(([k, v]) => url.searchParams.append(k, v));
  const resp = await fetch(url, { headers: SB_HEADERS });
  if (!resp.ok) throw new Error(`Supabase ${table}: ${resp.status}`);
  return resp.json();
}

function classifyEvent(calEvent) {
  const title = (calEvent.title || '').toLowerCase();
  const cat = (calEvent.category || '').toLowerCase();

  if (cat === 'production') return 'install';
  if (cat === 'pickups_and_dropoffs') return 'material_dropoff';
  if (cat === 'post_production') {
    if (title.includes('warranty')) return 'warranty';
    return 'walkthrough';
  }
  // Fallback: check title keywords
  if (title.includes('install') || title.includes('roof install')) return 'install';
  if (title.includes('material') || title.includes('drop')) return 'material_dropoff';
  if (title.includes('walk') || title.includes('walkthrough')) return 'walkthrough';
  if (title.includes('warranty')) return 'warranty';
  return 'other';
}

function parseAddress(title) {
  // Calendar titles are often just addresses — extract if it looks like one
  if (/\d+.*(?:street|drive|avenue|road|lane|place|court|way|boulevard|circle|trail)/i.test(title)) {
    return title.split(',').slice(0, -1).join(',').trim() || title;
  }
  return null;
}

function parseCity(address) {
  if (!address) return '';
  const parts = address.split(',').map(p => p.trim());
  if (parts.length >= 3) return parts[parts.length - 2].replace(/\s+AZ\s*\d*/i, '').trim();
  if (parts.length === 2) return parts[1].replace(/\s*AZ\s*\d*/i, '').trim();
  return '';
}

function formatTime(dateTimeStr) {
  if (!dateTimeStr) return null;
  const match = dateTimeStr.match(/(\d{2}):(\d{2})/);
  if (!match) return null;
  let h = parseInt(match[1]), m = match[2];
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

// ── Map ──
function initMap() {
  map = L.map('map', { center: [33.4484, -112.074], zoom: 9, zoomControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);
  markersLayer = L.featureGroup().addTo(map);
}

// ── Geocoding ──
const AZ_BOUNDS = { north: 37.1, south: 31.2, west: -115.0, east: -108.9 };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function geocodeAddress(address) {
  if (geocodeCache[address]) return geocodeCache[address];
  let query = address.replace(/\s+/g, ' ').trim();
  if (!/arizona|az/i.test(query)) query += ', Arizona';

  try {
    await sleep(300);
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=us&limit=3`;
    const resp = await fetch(url, { headers: { 'User-Agent': 'AZRoofers-ProductionMap/1.0' } });
    const results = await resp.json();
    for (const r of results) {
      const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
      if (lat >= AZ_BOUNDS.south && lat <= AZ_BOUNDS.north && lon >= AZ_BOUNDS.west && lon <= AZ_BOUNDS.east) {
        const coord = { lat, lon };
        geocodeCache[address] = coord;
        saveGeocodeCache();
        return coord;
      }
    }
  } catch (e) { console.warn('Geocode failed:', address, e); }
  return null;
}

// ── Marker shapes — fill=PM color, outline glow=type color ──
function makeMarkerHtml(type, pmColor, size) {
  const cfg = TYPE_CONFIG[type] || TYPE_CONFIG.other;
  const typeColor = cfg.color;
  const glow = `0 0 0 3px ${typeColor}, 0 0 8px ${typeColor}90`;
  if (cfg.shape === 'diamond') {
    return `<div style="width:${size}px; height:${size}px; transform:rotate(45deg); background:${pmColor}; border:2px solid #fff; border-radius:2px; box-shadow: ${glow};"></div>`;
  }
  if (cfg.shape === 'circle') {
    return `<div style="width:${size}px; height:${size}px; background:${pmColor}; border:2px solid #fff; border-radius:50%; box-shadow: ${glow};"></div>`;
  }
  // square (default — installs)
  return `<div style="width:${size}px; height:${size}px; background:${pmColor}; border:2px solid #fff; border-radius:3px; box-shadow: ${glow};"></div>`;
}

// ── Colors (stable: production team always gets same colors) ──
function buildPMColors() {
  const colorMap = {};
  PROD_TEAM.forEach((name, idx) => { colorMap[name] = PALETTE[idx % PALETTE.length]; });
  return colorMap;
}

// ── Render PM panel (only PMs active that day) ──
function renderPMPanel(events) {
  const pmList = document.getElementById('pmList');
  const counts = {};
  events.forEach(e => {
    const owner = e.jobOwner || '';
    if (owner) counts[owner] = (counts[owner] || 0) + 1;
  });

  // Only show PMs with events today, production team first
  const prodActive = PROD_TEAM.filter(n => counts[n]);
  const othersActive = Object.keys(counts).filter(n => !PROD_TEAM.includes(n)).sort();
  const activePMs = [...prodActive, ...othersActive];

  pmList.innerHTML = activePMs.map(name => `
    <li class="pm-item${selectedPM === name ? ' active' : ''}"
        data-pm="${name}"
        onmouseenter="onPMHover('${name.replace(/'/g, "\\'")}')"
        onmouseleave="onPMHover(null)"
        onclick="onPMClick('${name.replace(/'/g, "\\'")}')">
      <span class="pm-dot" style="background:${colorMap[name] || '#999'}"></span>
      <span class="pm-name">${name}</span>
      <span class="pm-count">${counts[name]}</span>
    </li>
  `).join('');
}

// ── PM hover/click filtering ──
function onPMHover(pmName) {
  if (selectedPM) return; // click-lock takes priority
  hoveredPM = pmName;
  applyPMFilter(pmName);
}

function onPMClick(pmName) {
  if (selectedPM === pmName) {
    // Deselect
    selectedPM = null;
    applyPMFilter(null);
  } else {
    selectedPM = pmName;
    applyPMFilter(pmName);
  }
  // Update active class on panel items
  document.querySelectorAll('.pm-item').forEach(li => {
    li.classList.toggle('active', li.dataset.pm === selectedPM);
  });
}

function applyPMFilter(pmName) {
  Object.entries(markersByPM).forEach(([owner, markers]) => {
    markers.forEach(({ marker, baseIcon, dimIcon }) => {
      if (!pmName || owner === pmName) {
        marker.setIcon(baseIcon);
        marker.setZIndexOffset(500);
        marker.setOpacity(1);
      } else {
        marker.setIcon(dimIcon);
        marker.setZIndexOffset(0);
        marker.setOpacity(0.7);
      }
    });
  });
}

// ── Render stats chips (with type icon) ──
const TYPE_ICONS = {
  install: '<svg width="10" height="10"><rect x="0" y="0" width="10" height="10" rx="2" fill="#16a34a"/></svg>',
  material_dropoff: '<svg width="12" height="12"><rect x="2" y="2" width="8" height="8" rx="1" fill="#ea580c" transform="rotate(45 6 6)"/></svg>',
  walkthrough: '<svg width="10" height="10"><circle cx="5" cy="5" r="5" fill="#f59e0b"/></svg>',
  warranty: '<svg width="10" height="10"><circle cx="5" cy="5" r="5" fill="#f59e0b"/></svg>',
};

function renderStats(events) {
  const bar = document.getElementById('statsBar');
  const counts = {};
  events.forEach(e => { counts[e.type] = (counts[e.type] || 0) + 1; });

  bar.innerHTML = Object.entries(counts).map(([type, count]) => {
    const cfg = TYPE_CONFIG[type] || TYPE_CONFIG.other;
    const icon = TYPE_ICONS[type] || '';
    return `<div class="stat-chip">${icon}<span class="stat-count" style="color:${cfg.color}">${count}</span> ${cfg.label}${count !== 1 ? 's' : ''}</div>`;
  }).join('');
}

// ── Render markers (tracks per-PM for hover/click filtering) ──
async function renderMarkers(events) {
  markersLayer.clearLayers();
  markersByPM = {};
  selectedPM = null;
  hoveredPM = null;

  for (const evt of events) {
    let coord = (evt.lat && evt.lon) ? { lat: evt.lat, lon: evt.lon } : null;
    if (!coord && evt.address) coord = await geocodeAddress(evt.address);
    if (!coord) continue;

    const cfg = TYPE_CONFIG[evt.type] || TYPE_CONFIG.other;
    const pmColor = colorMap[evt.jobOwner] || '#888';
    const size = 16;
    const markerHtml = makeMarkerHtml(evt.type, pmColor, size);

    const baseIcon = L.divIcon({
      html: markerHtml, className: '', iconSize: [size + 4, size + 4],
      iconAnchor: [(size + 4) / 2, (size + 4) / 2]
    });

    // Desaturated version for non-matching PM filter
    const dimHtml = `<div style="filter:grayscale(100%); opacity:0.35;">${markerHtml}</div>`;
    const dimIcon = L.divIcon({
      html: dimHtml, className: '', iconSize: [size + 4, size + 4],
      iconAnchor: [(size + 4) / 2, (size + 4) / 2]
    });

    const marker = L.marker([coord.lat, coord.lon], { icon: baseIcon, zIndexOffset: 500 });

    const valueStr = evt.value != null ? `$${Number(evt.value).toLocaleString()}` : '';
    const timeStr = [evt.startTime, evt.endTime].filter(Boolean).join(' - ');

    const tooltip = `
      <div style="text-align:center; line-height:1.4; min-width:140px; font-family:inherit;">
        <div style="font-weight:700; font-size:10px; color:${cfg.color}; text-transform:uppercase; letter-spacing:.3px;">${cfg.label}</div>
        <div style="font-weight:800; font-size:13px; color:#222; margin:2px 0;">${evt.customerName}</div>
        <div style="font-size:10px; color:#666;">${evt.city || ''}</div>
        ${valueStr ? `<div style="font-weight:700; font-size:12px; color:#c2410c; margin-top:3px;">${valueStr}</div>` : ''}
        ${timeStr ? `<div style="font-size:10px; color:#888; margin-top:2px;">${timeStr}</div>` : ''}
        <div style="font-size:10px; color:#999; margin-top:2px;">${evt.jobOwner || ''}</div>
      </div>`;

    marker.bindTooltip(tooltip, { direction: 'top', offset: [0, -10] });

    const popup = `
      <div style="font-family:-apple-system,sans-serif; min-width:220px; line-height:1.5;">
        <div style="display:inline-block; font-size:10px; font-weight:700; color:#fff; background:${cfg.color}; padding:2px 8px; border-radius:4px; margin-bottom:6px;">${cfg.label}</div>
        <div style="font-weight:800; font-size:15px; margin-bottom:4px;">${evt.customerName}</div>
        <div style="font-size:12px; color:#555; margin-bottom:8px;">${evt.address}</div>
        <div style="display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px;">
          ${evt.stage ? `<span style="color:#999; font-weight:600;">Stage</span><span>${evt.stage}</span>` : ''}
          ${valueStr ? `<span style="color:#999; font-weight:600;">Value</span><span style="font-weight:700; color:#c2410c;">${valueStr}</span>` : ''}
          ${timeStr ? `<span style="color:#999; font-weight:600;">Time</span><span>${timeStr}</span>` : ''}
          ${evt.jobOwner ? `<span style="color:#999; font-weight:600;">PM</span><span>${evt.jobOwner}</span>` : ''}
          ${evt.crew ? `<span style="color:#999; font-weight:600;">Crew</span><span>${evt.crew}</span>` : ''}
        </div>
        ${evt.jobId ? `<div style="margin-top:8px; text-align:right;"><a href="https://app.roofr.com/dashboard/team/${ROOFR_TEAM}/jobs/list-view?selectedJobId=${evt.jobId}" target="_blank" rel="noopener noreferrer" style="font-size:11px; color:#ea580c; font-weight:600; text-decoration:none;">Open in Roofr &rarr;</a></div>` : ''}
      </div>`;

    marker.bindPopup(popup, { minWidth: 240 });
    marker.addTo(markersLayer);

    // Track marker by PM for hover/click filtering
    const owner = evt.jobOwner || 'Unknown';
    if (!markersByPM[owner]) markersByPM[owner] = [];
    markersByPM[owner].push({ marker, baseIcon, dimIcon, evt });
  }

  if (markersLayer.getLayers().length > 0) {
    map.fitBounds(markersLayer.getBounds().pad(0.15));
  }
}

// ── Load events from Supabase ──
async function loadEvents() {
  const loadingEl = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const emptyEl = document.getElementById('emptyState');

  loadingEl.classList.remove('hidden');
  emptyEl.classList.add('hidden');
  markersLayer.clearLayers();
  loadingText.textContent = 'Loading events...';

  try {
    const nextDay = new Date(new Date(currentDate + 'T12:00:00').getTime() + 86400000).toISOString().split('T')[0];

    // 1. Fetch calendar events for this date (production-related categories)
    // Some events have date in `start`, others in `start_date` (null `start`). Query both.
    const dateGte = `${currentDate} 00:00:00`;
    const dateLt = `${nextDay} 00:00:00`;
    const cats = 'in.(production,post_production,pickups_and_dropoffs)';
    const sel = 'select=event_id,job_id,title,start,end,start_date,end_date,category,attendees';
    const calUrl = `${SB_URL}/calendar_events?${sel}&or=(and(start.gte.${encodeURIComponent(dateGte)},start.lt.${encodeURIComponent(dateLt)}),and(start.is.null,start_date.gte.${encodeURIComponent(dateGte)},start_date.lt.${encodeURIComponent(dateLt)}))&category=${cats}&limit=200`;
    const calResp = await fetch(calUrl, { headers: SB_HEADERS });
    if (!calResp.ok) throw new Error(`Calendar query failed: ${calResp.status}`);
    const calEvents = await calResp.json();

    if (!calEvents || calEvents.length === 0) {
      events = [];
      loadingEl.classList.add('hidden');
      emptyEl.classList.remove('hidden');
      document.getElementById('pmList').innerHTML = '';
      document.getElementById('statsBar').innerHTML = '';
      return;
    }

    // 2. Collect job IDs and fetch job details
    const jobIds = [...new Set(calEvents.map(e => e.job_id).filter(Boolean))];
    let jobMap = {};

    if (jobIds.length > 0) {
      // Fetch in batches of 50 (PostgREST in() limit)
      for (let i = 0; i < jobIds.length; i += 50) {
        const batch = jobIds.slice(i, i + 50);
        const jobs = await sbGet('jobs', {
          'select': 'job_id,name,address,stage,value,job_owner,latitude,longitude',
          'job_id': `in.(${batch.join(',')})`,
        });
        jobs.forEach(j => { jobMap[String(j.job_id)] = j; });
      }
    }

    // 3. Build unified events list — PM comes from calendar attendees, not job_owner
    events = calEvents.map(cal => {
      const job = jobMap[cal.job_id] || {};
      const type = classifyEvent(cal);
      const address = job.address || parseAddress(cal.title) || cal.title || '';
      const { names: crewNames, prodMember } = resolveAttendees(cal.attendees);

      return {
        type,
        jobId: cal.job_id,
        customerName: job.name || '',
        address,
        city: parseCity(address),
        stage: job.stage || '',
        jobOwner: prodMember || crewNames[0] || '',  // PM from calendar, not sales rep
        value: job.value,
        lat: job.latitude ? parseFloat(job.latitude) : null,
        lon: job.longitude ? parseFloat(job.longitude) : null,
        crew: crewNames.join(', '),
        startTime: formatTime(cal.start || cal.start_date),
        endTime: formatTime(cal.end || cal.end_date),
        calTitle: cal.title,
      };
    });

    colorMap = buildPMColors();
    renderPMPanel(events);
    renderStats(events);

    loadingText.textContent = `Mapping ${events.length} events...`;
    await renderMarkers(events);

    loadingEl.classList.add('hidden');

  } catch (err) {
    console.error('Failed to load events:', err);
    loadingEl.classList.add('hidden');
    emptyEl.querySelector('h2').textContent = 'Error loading data';
    emptyEl.querySelector('p').textContent = err.message;
    emptyEl.classList.remove('hidden');
  }
}

// ── Boot ──
document.addEventListener('DOMContentLoaded', () => {
  currentDate = todayPhoenix();
  const picker = document.getElementById('datePicker');
  picker.value = currentDate;
  picker.addEventListener('change', (e) => {
    currentDate = e.target.value;
    updateDateDisplay();
    loadEvents();
  });

  updateDateDisplay();
  initMap();
  loadEvents();
});
</script>
